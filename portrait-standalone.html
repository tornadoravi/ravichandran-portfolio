.portrait-home { --home-header-height: clamp(96px, 8vw, 148px); background: #080809; }
.portrait-home .site-header { width: min(1840px, calc(100% - 112px)); min-height: var(--home-header-height); border-color: #303b33; }
.portrait-home .wordmark { font-size: clamp(19px, 1.65vw, 32px); letter-spacing: -.04em; }
.portrait-home .site-header nav { font-size: clamp(14px, 1.05vw, 20px); gap: clamp(28px, 3.2vw, 64px); }
.portrait-home #main { scroll-margin-top: var(--home-header-height); }
.portrait-home .nav-note { display: none; }
.portrait-hero { --scene-height: max(640px, calc(100svh - var(--home-header-height, 110px))); position: relative; isolation: isolate; overflow: hidden; width: 100%; height: var(--scene-height); margin: 0; color: #eeeae7; background: #080809; }
.portrait-hero::before { content: ""; position: absolute; pointer-events: none; inset: 0; z-index: -1; background: radial-gradient(ellipse at 24% 80%, #b9f5cd12, transparent 48%), radial-gradient(ellipse at 80% 60%, #c7b8ff19, transparent 52%); animation: portrait-light 2.6s cubic-bezier(.16, 1, .3, 1) backwards; }
.portrait-kicker { position: absolute; top: clamp(28px, 2.4vw, 48px); inset-inline: max(56px, calc((100% - 1840px) / 2)); display: flex; justify-content: space-between; gap: 20px; font-size: clamp(10px, .8vw, 16px); text-transform: uppercase; letter-spacing: 2px; color: #aaa4a6; z-index: 3; }
.portrait-title { position: absolute; top: 29%; left: 0; width: 100%; margin: 0; padding: 0 1.5vw; text-align: center; font-family: Anton, Impact, "Arial Narrow", sans-serif; font-size: 14.5vw; line-height: 1.1; font-weight: 400; letter-spacing: -.025em; white-space: nowrap; z-index: 0; }
.portrait-title > span { display: inline-block; background: linear-gradient(110deg, #a5c4af 0%, #9daead 38%, #b0a1c9 72%, #bd9ba9 100%); -webkit-background-clip: text; background-clip: text; color: transparent; opacity: .63; mask-image: linear-gradient(#000 5%, #00000020 100%); }
.portrait-title em { font: inherit; }
.portrait-stage { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding-top: calc(var(--scene-height) * .14); pointer-events: none; mask-image: linear-gradient(#000 77%, transparent 100%); z-index: 1; }
.portrait-stage::before { content: ""; position: absolute; width: min(54vw, 1000px); aspect-ratio: 1; top: 10%; left: 50%; transform: translateX(-50%); border: 1px solid #b9f5cd28; border-radius: 50%; pointer-events: none; }
.portrait-art { position: relative; display: block; width: min(78vw, 1000px, calc(var(--scene-height) * .82)); height: auto; max-width: none; flex-shrink: 0; transform: translate3d(var(--portrait-x, 0px), var(--portrait-y, 0px), 0); transition: transform .8s cubic-bezier(.16, 1, .3, 1); animation: portrait-arrive 1.4s cubic-bezier(.16, 1, .3, 1) backwards; }
.portrait-footer { position: absolute; bottom: 24px; inset-inline: max(56px, calc((100% - 1840px) / 2)); display: flex; justify-content: space-between; align-items: end; gap: 24px; z-index: 3; }
.portrait-footer p { margin: 0; color: #bac4be; font-size: 12px; line-height: 1.7; }
.portrait-footer p strong { color: #eeeae7; font-weight: 500; font-size: 14px; }
.portrait-work-link { display: inline-flex; align-items: center; gap: 24px; min-height: 48px; padding: 8px 0 8px 12px; border-bottom: 1px solid #b9f5cd60; color: #eeeae7; font-size: 12px; text-decoration: none; transition: color .25s, border-color .25s; }
.portrait-work-link:hover { color: #b9f5cd; border-color: #b9f5cd; }
.portrait-work-link:focus-visible { outline: 2px solid #b9f5cd; outline-offset: 5px; }
.portrait-work-link span { display: grid; place-items: center; width: 30px; height: 30px; color: #b9f5cd; font-size: 24px; transition: transform .3s; }
.portrait-work-link:hover span { transform: translateY(3px); }
@keyframes portrait-arrive { from { opacity: 0; transform: translate3d(0, 30px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
@keyframes portrait-light { from { opacity: 0; } to { opacity: 1; } }
.bookmark-entry .portrait-art, .bookmark-entry .portrait-hero::before { animation: none; }
@media (max-width: 1050px) {
  .portrait-home .site-header { width: calc(100% - 72px); }
  .portrait-kicker, .portrait-footer { inset-inline: 36px; }
  .portrait-stage::before { width: 78vw; }
}
@media (max-width: 700px) {
  .portrait-home { --home-header-height: 80px; }
  .portrait-home .site-header { width: calc(100% - 40px); }
  .portrait-home .wordmark { font-size: 17px; }
  .portrait-home .site-header nav { font-size: 14px; gap: 20px; }
  .portrait-hero { --scene-height: max(620px, calc(100svh - 80px)); }
  .portrait-kicker { top: 24px; inset-inline: 20px; font-size: 8px; letter-spacing: 1px; gap: 12px; }
  .portrait-title { top: 30%; font-size: 25vw; line-height: 1.08; white-space: normal; }
  .portrait-title em { display: block; }
  .portrait-stage { padding-top: calc(var(--scene-height) * .18); }
  .portrait-stage::before { width: min(112vw, 620px); top: 12%; }
  .portrait-art { width: min(116vw, 600px, calc(var(--scene-height) * .72)); }
  .portrait-footer { inset-inline: 20px; bottom: 18px; gap: 12px; }
  .portrait-footer p { font-size: 12px; max-width: 175px; }
  .portrait-footer p strong { font-size: 13px; }
  .portrait-work-link { gap: 8px; padding-left: 0; flex-shrink: 0; }
}
@media (max-width: 360px) {
  .portrait-kicker { font-size: 7px; letter-spacing: .8px; }
  .portrait-footer p { max-width: 150px; }
  .portrait-footer p strong { font-size: 12px; }
  .portrait-work-link { gap: 6px; }
  .portrait-work-link span { width: 24px; height: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .portrait-art, .portrait-hero::before { animation: none; transition: none; transform: none; }
  .portrait-work-link, .portrait-work-link span { transition: none; }
  .portrait-work-link:hover span { transform: none; }
}
