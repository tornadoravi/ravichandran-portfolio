<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
  <title id="title">Conceptual illustration: connect a chart annotation with its explanation</title>
  <desc id="description">Original portfolio artwork, not a product screenshot. A fictional regional comparison uses markers A and B to connect two bars to explanatory notes. A summary below separates the specific observation from the wider report context.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f9fbfa"/></linearGradient>
    <linearGradient id="sage" x2="0" y2="1"><stop stop-color="#91a89b"/><stop offset="1" stop-color="#668577"/></linearGradient>
    <radialGradient id="ground"><stop stop-color="#f9fbfa"/><stop offset="1" stop-color="#eef3ef"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5dfd8" stroke-opacity=".25"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="155%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#334e43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1040" height="580" fill="url(#ground)"/>
  <rect width="1040" height="580" fill="url(#grid)"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#526960">
    <path d="M32 70H1008" stroke="#cbd8d2"/>
    <text x="32" y="42" font-size="16" letter-spacing="1.5">ILLUSTRATIVE WORKFLOW / ADD CONTEXT</text>
    <text x="32" y="112" font-size="25">The observation and its explanation, connected.</text>
    <rect class="back" x="37" y="147" width="590" height="316" rx="12" fill="#e5ede8" stroke="#cbd8d2"/>
    <rect class="paper" x="32" y="142" width="590" height="316" rx="12" fill="url(#paper)" stroke="#cbd8d2" filter="url(#shadow)"/>
    <text x="56" y="177" font-size="18">Regional comparison</text>
    <text x="56" y="203" font-size="14" fill="#5d7065">Fictional data for illustration</text>
    <path d="M72 250H582M72 302H582M72 354H582M72 406H582" stroke="#d7e1da"/>
    <rect x="105" y="315" width="60" height="91" fill="#b7c8bc"/>
    <rect x="220" y="269" width="60" height="137" fill="#b7c8bc"/>
    <rect x="335" y="235" width="60" height="171" rx="4" fill="url(#sage)"/>
    <rect x="450" y="330" width="60" height="76" fill="#b7c8bc"/>
    <g font-size="14" text-anchor="middle" fill="#5d7065">
      <text x="135" y="432">North</text><text x="250" y="432">South</text>
      <text x="365" y="432">East</text><text x="480" y="432">West</text>
    </g>
    <path d="M365 220V208H638V205H658M480 315V294H658" fill="none" stroke="#526960" stroke-width="2"/>
    <rect x="351" y="208" width="28" height="28" fill="#526960"/>
    <rect x="466" y="302" width="28" height="28" fill="#526960"/>
    <g font-size="16" fill="#fff" text-anchor="middle"><text x="365" y="228">A</text><text x="480" y="322">B</text></g>
    <rect class="back" x="663" y="147" width="350" height="316" rx="12" fill="#e5ede8" stroke="#cbd8d2"/>
    <rect class="paper" x="658" y="142" width="350" height="316" rx="12" fill="url(#paper)" stroke="#cbd8d2" filter="url(#shadow)"/>
    <text x="682" y="177" font-size="18">Explanations</text>
    <rect x="682" y="197" width="26" height="26" fill="#526960"/>
    <text x="695" y="216" font-size="15" text-anchor="middle" fill="#fff">A</text>
    <text x="724" y="216" font-size="16">Explain the higher value</text>
    <text x="724" y="244" font-size="14" fill="#5d7065">Keep the note tied to its data point.</text>
    <path d="M682 265H984" stroke="#d7e1da"/>
    <rect x="682" y="282" width="26" height="26" fill="#526960"/>
    <text x="695" y="301" font-size="15" text-anchor="middle" fill="#fff">B</text>
    <text x="724" y="301" font-size="16">Call attention to a contrast</text>
    <text x="724" y="329" font-size="14" fill="#5d7065">Make the intended reference explicit.</text>
    <path d="M682 350H984" stroke="#d7e1da"/>
    <text x="682" y="381" font-size="14" fill="#5d7065">Report-level context</text>
    <text x="682" y="409" font-size="16">What does the audience need to know?</text>
    <rect x="32" y="486" width="976" height="60" fill="#e9f0eb"/>
    <g font-size="16">
      <text x="56" y="522">01 / Identify the point</text>
      <text x="382" y="522">02 / Explain the meaning</text>
      <text x="724" y="522">03 / Keep the context</text>
    </g>
  </g>
</svg>
