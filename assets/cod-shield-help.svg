<svg class="cod-mobile-screen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-label="COD Shield help mobile-app concept screen. Fictional example; no real service." font-family="Arial, sans-serif"><rect x="3" y="3" width="384" height="838" rx="38" fill="#272521"></rect><rect x="11" y="11" width="368" height="822" rx="30" fill="#f4f2ee"></rect><text x="32" y="40" fill="#272521" font-size="11" font-weight="700">9:41</text><rect x="145" y="20" width="100" height="18" rx="9" fill="#272521"></rect><path d="M319 31h3v7h-3Zm6-3h3v10h-3Zm6-3h3v13h-3Z" fill="#272521"></path><rect x="341" y="27" width="17" height="10" rx="2" fill="none" stroke="#272521"></rect><rect x="343" y="29" width="12" height="6" rx="1" fill="#272521"></rect><rect x="30" y="65" width="34" height="34" rx="11" fill="#fddeb9"></rect><path d="m47 72-9 4v8c0 5 9 10 9 10s9-5 9-10v-8Z" fill="none" stroke="#272521" stroke-width="1.7"></path><text x="76" y="81" fill="#272521" font-size="17" font-weight="700">Amazon / COD Shield</text><text x="76" y="98" fill="#6a655d" font-size="9">FEATURE CONCEPT / AMAZON ORDERS ONLY</text><rect x="30" y="123" width="170" height="25" rx="12" fill="#fddeb9"></rect><text x="42" y="140" fill="#272521" font-size="10">FICTIONAL CASE / CS-1042</text><text x="30" y="185" fill="#272521" font-size="25" font-weight="700">Support, disputes</text><text x="30" y="215" fill="#272521" font-size="25" font-weight="700">and a clear appeal.</text><text x="30" y="246" fill="#6a655d" font-size="12">Report a wrong unit or household dispute.</text><text x="30" y="265" fill="#6a655d" font-size="12">An authorised support route would review it.</text><g><rect x="30" y="295" width="330" height="113" rx="15" fill="#fddeb9" stroke="#ded9cf"></rect><text x="46" y="322" fill="#272521" font-size="14" font-weight="700">Challenge a wrong restriction</text><text x="46" y="345" fill="#6a655d" font-size="12">Wrong unit, household dispute or buyer appeal.</text><text x="46" y="364" fill="#6a655d" font-size="12">An accountable reviewer must investigate.</text><text x="46" y="383" fill="#6a655d" font-size="12">An address alone is not proof of abuse.</text></g><g><rect x="30" y="442" width="330" height="113" rx="15" fill="#fffdf8" stroke="#ded9cf"></rect><text x="46" y="469" fill="#272521" font-size="14" font-weight="700">Accessible alternatives</text><text x="46" y="492" fill="#6a655d" font-size="12">A web case page and official phone support.</text><text x="46" y="511" fill="#6a655d" font-size="12">Agree on a safe, limited contact method.</text><text x="46" y="530" fill="#6a655d" font-size="12">No call, message or appeal is sent here.</text></g><rect x="30" y="698" width="330" height="48" rx="14" fill="#272521"></rect><text x="195" y="728" text-anchor="middle" fill="#fffdf8" font-size="12" font-weight="700">Read the example appeal route</text><text x="195" y="768" text-anchor="middle" fill="#6a655d" font-size="9">Original concept. No verification or actual protection.</text><path d="M12 782h366" stroke="#ded9cf"></path><text x="57" y="807" text-anchor="middle" fill="#8a8378" font-size="10" font-weight="700">Home</text><text x="149" y="807" text-anchor="middle" fill="#8a8378" font-size="10" font-weight="700">My case</text><text x="241" y="807" text-anchor="middle" fill="#8a8378" font-size="10" font-weight="700">Status</text><text x="333" y="807" text-anchor="middle" fill="#272521" font-size="10" font-weight="700">Help</text><rect x="142" y="819" width="106" height="4" rx="2" fill="#272521"></rect></svg>
